<div class="yuki-dg" id="yuki-dg1">
<style>
.yuki-dg{position:relative;width:100%;max-width:640px;aspect-ratio:2/3;overflow:hidden;background:#11131e;isolation:isolate;font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:clamp(12px,3.5vw,17px);line-height:1.7;color:#fff0f3}
.yuki-dg *{box-sizing:border-box}
.yuki-dg .dg-s{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.yuki-dg .dg-step{position:absolute;inset:0;display:none}
.yuki-dg .dg-s:checked+.dg-step{display:block}
.yuki-dg .dg-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yuki-dg .dg-role,.yuki-dg .dg-player{position:absolute;bottom:26%;width:57%;height:68%;object-fit:contain;object-position:bottom center;opacity:.36;filter:grayscale(.55) brightness(.7);transform:translateY(2%) scale(.96)}
.yuki-dg .dg-role{left:-3%}
.yuki-dg .dg-player{right:-3%}
.yuki-dg .dg-speak-role .dg-role,.yuki-dg .dg-speak-player .dg-player{opacity:1;filter:none;transform:none;z-index:2}
.yuki-dg .dg-box{position:absolute;left:4%;bottom:3%;width:92%;height:27%;padding:4% 4% 8%;border:1px solid #b9778e;border-radius:12px;background:rgba(22,10,23,.9);overflow:auto;z-index:3}
.yuki-dg .dg-name{display:inline-block;margin-bottom:.5em;padding:.1em .8em;border-radius:999px;color:#301020;background:#f3b6c9;font-size:.92em;font-weight:700}
.yuki-dg .dg-speak-player .dg-name{background:#bad5ff;color:#102038}
.yuki-dg .dg-text{margin:0;line-height:1.7;overflow-wrap:anywhere}
.yuki-dg .dg-hit{position:absolute;inset:0;z-index:6;cursor:pointer}
.yuki-dg .dg-restart{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);z-index:7;padding:.25em 1.2em;border:1px solid #df98b0;border-radius:999px;background:#2b1628;color:#fff0f3;font-size:.82em;white-space:nowrap;cursor:pointer;animation:yuki-dg1-in .3s ease 1.2s both}
@keyframes yuki-dg1-in{from{opacity:0;visibility:hidden}to{opacity:1;visibility:visible}}
</style>

  <input class="dg-s" type="radio" name="yuki-dg1" id="yuki-dg1-1" checked>
  <div class="dg-step dg-speak-role">
    <img class="dg-bg" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/%E8%83%8C%E6%99%AF/%E5%87%BA%E7%A7%9F%E6%88%BF-%E6%99%9A%E4%B8%8A.png" alt="夜晚的出租房">
    <img class="dg-role" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/Yuki/%E7%AB%8B%E7%BB%98/%E5%B0%91%E5%A5%B3%E5%BD%A2%E6%80%81/%E5%BE%85%E6%9C%BA.png" alt="Yuki·少女形态·待机">
    <img class="dg-player" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/%E7%8E%A9%E5%AE%B6/%E7%AB%8B%E7%BB%98/%E7%8E%A9%E5%AE%B6-%E5%BE%85%E6%9C%BA%E7%AB%8B%E7%BB%98.png" alt="{{user}}">
    <div class="dg-box">
      <b class="dg-name">Yuki</b>
      <p class="dg-text">回来了？……饭还热着，先去洗手。</p>
    </div>
    <label class="dg-hit" for="yuki-dg1-2" aria-label="继续"></label>
  </div>

  <input class="dg-s" type="radio" name="yuki-dg1" id="yuki-dg1-2">
  <div class="dg-step dg-speak-player">
    <img class="dg-bg" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/%E8%83%8C%E6%99%AF/%E5%87%BA%E7%A7%9F%E6%88%BF-%E6%99%9A%E4%B8%8A.png" alt="夜晚的出租房">
    <img class="dg-role" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/Yuki/%E7%AB%8B%E7%BB%98/%E5%B0%91%E5%A5%B3%E5%BD%A2%E6%80%81/%E5%BE%85%E6%9C%BA.png" alt="Yuki·少女形态·待机">
    <img class="dg-player" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/%E7%8E%A9%E5%AE%B6/%E7%AB%8B%E7%BB%98/%E7%8E%A9%E5%AE%B6-%E5%BE%85%E6%9C%BA%E7%AB%8B%E7%BB%98.png" alt="{{user}}">
    <div class="dg-box">
      <b class="dg-name">{{user}}</b>
      <p class="dg-text">你一直在等我吗？</p>
    </div>
    <label class="dg-hit" for="yuki-dg1-3" aria-label="继续"></label>
  </div>

  <input class="dg-s" type="radio" name="yuki-dg1" id="yuki-dg1-3">
  <div class="dg-step dg-speak-role">
    <img class="dg-bg" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/%E8%83%8C%E6%99%AF/%E5%87%BA%E7%A7%9F%E6%88%BF-%E6%99%9A%E4%B8%8A.png" alt="夜晚的出租房">
    <img class="dg-role" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/Yuki/%E7%AB%8B%E7%BB%98/%E5%B0%91%E5%A5%B3%E5%BD%A2%E6%80%81/%E5%AE%B3%E7%BE%9E.png" alt="Yuki·少女形态·害羞">
    <img class="dg-player" src="https://cdn.jsdelivr.net/gh/karina-zzya/AI-assets@main/%E7%8E%A9%E5%AE%B6/%E7%AB%8B%E7%BB%98/%E7%8E%A9%E5%AE%B6-%E5%BE%85%E6%9C%BA%E7%AB%8B%E7%BB%98.png" alt="{{user}}">
    <div class="dg-box">
      <b class="dg-name">Yuki</b>
      <p class="dg-text">才、才没有。只是刚好多做了一份……别让我再热第二遍。</p>
    </div>
    <label class="dg-restart" for="yuki-dg1-1">重新开始</label>
  </div>
</div>
